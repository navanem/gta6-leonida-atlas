# Traefik strips only the configured Atlas prefix; public forks may run at /.
map $http_x_forwarded_prefix $atlas_prefix {
  default "";
  ~^(/[a-zA-Z0-9_-]+)+$ $http_x_forwarded_prefix;
}
map "$uri?$args" $atlas_project_alias {
  default "";
  ~^/(?:index\.html)?[?]page=(?<atlas_page>about|documentation|credits|contributing|changelog|licenses)$ $atlas_page;
}
map "$uri?$args" $atlas_robots {
  default "noindex, follow";
  ~^/(?:index\.html|(?:about|documentation|credits|contributing|changelog|licenses)(?:/index\.html)?)?[?]$ "";
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
  add_header X-Robots-Tag $atlas_robots always;
  absolute_redirect off;
  if ($atlas_project_alias != "") { return 301 $atlas_prefix/$atlas_project_alias; }
  location = /index.html { return 301 $atlas_prefix/$is_args$args; }
  location ~ ^/(?<atlas_clean>about|documentation|credits|contributing|changelog|licenses|app)/(?:index\.html|/*)$ {
    return 301 $atlas_prefix/$atlas_clean$is_args$args;
  }
  location = / { try_files /index.html =404; }
  location ~ ^/(about|documentation|credits|contributing|changelog|licenses|app)$ {
    try_files $uri/index.html =404;
  }
  # Geographic app links are a utility in standalone forks; the official proxy
  # deliberately leaves them with the parent site's CMS-rendered resources.
  location ~ ^/app/(place|viewpoint)/[^/]+/?$ { try_files /app/index.html =404; }
  location / { try_files $uri =404; }
  error_page 404 /404.html;
  location = /404.html { internal; }
  location = /sw.js { expires -1; }
}
